<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansh | My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #000;
        }

        nav h1 {
            font-size: 28px;
            color: #00ff88;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h2 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero h2 span {
            color: #00ff88;
        }

        .hero p {
            font-size: 20px;
            color: #aaa;
            max-width: 600px;
            line-height: 1.6;
        }

        .button {
            margin-top: 30px;
            padding: 14px 28px;
            background: #00ff88;
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .about {
            padding: 80px 10%;
            text-align: center;
            background: #111;
        }

        .about h2 {
            font-size: 35px;
            margin-bottom: 20px;
        }

        .about p {
            color: #aaa;
            max-width: 700px;
            margin: auto;
            line-height: 1.7;
            font-size: 18px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #000;
            color: #777;
        }

        @media (max-width: 600px) {
            .hero h2 {
                font-size: 40px;
            }

            nav {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h1>ANSH</h1>
