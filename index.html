<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello Student Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#06182b;
    color:white;
    text-align:center;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#041323;
    padding:18px 10px;
    border-bottom:1px solid #073a5e;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#08c8ff;
    text-shadow:0 0 15px #00bfff;
}

nav{
    margin-top:12px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 8px;
    font-size:14px;
}

nav a:hover{
    color:#00c8ff;
}

/* =========================
   HERO
========================= */

.hero{
    padding:70px 20px 55px;
}

.hero h1{
    font-size:42px;
    color:#08c8ff;
    text-shadow:
        0 0 8px #00bfff,
        0 0 25px #00bfff;
}

.hero p{
    margin-top:15px;
    font-size:18px;
    color:#e8f7ff;
}

/* =========================
   PROFILE PHOTO
========================= */

.profile-photo{
    width:300px;
    height:300px;
    object-fit:cover;
    border-radius:50%;
    margin-top:35px;
    border:6px solid #08c8ff;

    box-shadow:
        0 0 15px #00c8ff,
        0 0 35px #00bfff,
        0 0 60px #008cff;
}

/* =========================
   SECTIONS
========================= */

section{
    padding:60px 20px;
    max-width:800px;
    margin:auto;
}

/* =========================
   GLOWING SECTION LOGO
========================= */

.section-logo{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:15px;

    font-size:40px;
    font-weight:bold;
    color:#08c8ff;
    letter-spacing:2px;

    padding:15px 30px;

    border:2px solid #08c8ff;
    border-radius:20px;

    text-shadow:
        0 0 8px #00bfff,
        0 0 20px #00bfff,
        0 0 40px #008cff;

    box-shadow:
        0 0 10px #00c8ff,
        0 0 25px rgba(0,200,255,0.5),
        inset 0 0 15px rgba(0,200,255,0.15);

    animation:sectionGlow 2s infinite alternate;
}

.section-icon{
    font-size:42px;
    filter:drop-shadow(0 0 10px #00c8ff);
}

@keyframes sectionGlow{

    from{
        box-shadow:
            0 0 10px #00c8ff,
            0 0 20px rgba(0,200,255,0.4),
            inset 0 0 10px rgba(0,200,255,0.1);
    }

    to{
        box-shadow:
            0 0 20px #00c8ff,
            0 0 45px rgba(0,200,255,0.7),
            inset 0 0 20px rgba(0,200,255,0.2);
    }

}

.description{
    font-size:17px;
    margin-top:22px;
    margin-bottom:30px;
    color:#f1f1f1;
}

/* =========================
   BUTTON
========================= */

.btn{
    display:inline-block;

    background:#08bdf2;
    color:#001522;

    padding:18px 35px;
    border-radius:12px;

    text-decoration:none;
    font-size:20px;
    font-weight:bold;

    box-shadow:
        0 0 8px #00c8ff,
        0 0 25px #00aeea;

    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);

    box-shadow:
        0 0 15px #00c8ff,
        0 0 40px #00aeea;
}

/* =========================
   CARDS
========================= */

.card-container{
    display:grid;
    grid-template-columns:1fr;
    gap:22px;
    margin-top:30px;
}

.card{
    padding:28px 20px;

    border:1px solid #b9d9e8;
    border-radius:15px;

    background:#071d32;

    box-shadow:
        0 0 10px rgba(0,190,255,0.15);

    transition:0.3s;
}

.card:hover{
